<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Business Intelligence Agent</title>

<link rel="stylesheet" href="app.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

</head>


<body>


<div class="app-container">


<!-- Sidebar -->
<aside class="sidebar" id="sidebar">


<div class="sidebar-header">

<div style="display:flex;justify-content:space-between;align-items:center">

<h2>AI BI</h2>

<button
id="toggleSidebar"
class="settings-btn"
title="Close Sidebar">

☰

</button>

</div>


<button
class="new-chat-btn"
title="Start New Chat">

+ New Chat

</button>

</div>


<nav class="chat-history" id="chatHistory"></nav>


</aside>




<!-- Chat -->
<main class="chat-container">


<header class="chat-header">

<h1>AI Business Intelligence Chat</h1>


<div class="header-actions">


<button
id="downloadChat"
class="settings-btn"
title="Download JSON">

⬇

</button>


<button
id="pdfChat"
class="settings-btn"
title="Export PDF">

📄

</button>


<button
id="printChat"
class="settings-btn"
title="Print Chat">

🖨

</button>


<button
id="clearChat"
class="settings-btn"
title="Clear Chat">

🗑

</button>


</div>


</header>




<div class="messages-container" id="messagesContainer">

<div class="message-group welcome">

<div class="message-content">

<h2>Welcome to AI Business Intelligence Agent</h2>

<p>Ask me anything about your business data</p>

</div>

</div>

</div>




<footer class="chat-footer">

<div class="input-group">


<button
id="uploadBtn"
class="send-btn"
title="Upload File">

+

</button>


<input
type="file"
id="fileInput"
hidden
>


<input
type="text"
id="messageInput"
class="message-input"
placeholder="Type your message here..."
>


<button
class="send-btn"
id="sendBtn"
title="Send Message">

Send

</button>


</div>


</footer>


</main>


</div>


<script src="app.js"></script>


</body>

</html>

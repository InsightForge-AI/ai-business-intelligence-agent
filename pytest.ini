[pytest]
; Avoids pytest's legacy "prepend" import mode, which walks up from each
; test file through __init__.py-having directories and inserts whatever
; directory it stops at onto sys.path. Several service packages here
; (nlp/teamB, ml/teamA, cv/teamB) are missing an __init__.py at their own
; level, so "prepend" mode ends up putting those directories directly on
; sys.path -- exposing their identically-named `src` subpackages as a
; global top-level `src` and causing cross-service collisions when the
; full suite runs in one process. See tests/test_module_namespace_collision.py.
; importlib mode collects each test file as a uniquely-named module without
; that global sys.path mutation, which avoids this specific failure mode.
addopts = --import-mode=importlib
